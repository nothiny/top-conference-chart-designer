<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Paper Chart Corpus</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><div><p class="eyebrow">PAPER CHART CORPUS</p><h1>顶会论文图表索引</h1><p class="muted">按会议、方向和图表类型浏览公开论文中的图表页面。</p></div><button id="reset" class="ghost">显示全部</button></header><section class="filters"><input id="q" type="search" placeholder="搜索论文标题、作者、关键词…"><select id="conference"><option value="">全部会议</option></select><select id="category"><option value="">全部方向</option></select><select id="chart"><option value="">全部图表类型</option></select><select id="year"><option value="">全部年份</option></select></section><div class="status"><span id="count">加载中…</span><span id="hint"></span></div><section id="grid" class="grid"></section><p id="empty" class="empty" hidden>没有匹配的图表。试试清空搜索或点击“显示全部”。</p></main><dialog id="viewer"><button class="close" aria-label="关闭">×</button><img id="large" alt=""><p id="caption"></p></dialog><script src="app.js"></script></body></html>
